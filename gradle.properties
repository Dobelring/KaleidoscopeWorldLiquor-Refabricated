# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.1.11.4-fabric+mc26.3
maven_group=com.bmt.kaleidoscope_world_liquor
archives_base_name=kaleidoscope_world_liquor

# Dependencies
fabric_api_version=0.161.0+26.3
forge_config_api_version=26.3.0
jade_version=26.3.0+fabric
jei_version=26.3-fabric:31.0.0.11

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

# Create Fly：第三方 Create 移植到 Fabric 的构建（官方 Create Fabric 只到 1.20.1，
# create-fly 从 1.21.8 起）。仅编译期依赖，运行时由玩家自行安装。
create_version=26.2-rc-2-6.0.9-1
