plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/kaleidoscope_world_liquor.accessWidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric API
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ForgeConfigAPIPort (NeoForge config API on Fabric)
	implementation ("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_version}")

	// Kaleidoscope Tavern (前置酒馆) — 文件依赖
	implementation files("libs/kaleidoscope_tavern-1.2.0.5-fabric+mc26.2.jar")

	// JEI（compileOnly）
	compileOnly "mezz.jei:jei-${project.jei_version}"
	// Jade
	implementation "maven.modrinth:jade:${project.jade_version}"
	// MixinExtras（@ModifyExpressionValue 等，@Expression 需 >=0.5.0-beta.1）
	include("io.github.llamalad7:mixinextras-fabric:0.5.4")
	implementation("io.github.llamalad7:mixinextras-fabric:0.5.4")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
